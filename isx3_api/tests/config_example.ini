# ==============================================================================
# Sciospec ISX-3 / ISX-3mini - Geräte-Konfigurationsdatei
# ==============================================================================
[ApiSettings]
# Eionstellungen für die API
# Plot-Typ: "impedance_frequency", "nyquist", "bode" oder "none"
plot_type = bode

[Connection]
# Schnittstellen-Einstellungen
# Mögliche Verbindungstypen: COM (Seriell/USB) oder TCP (Ethernet)
interface_type = COM
port = COM3
baudrate = 115200

# Ethernet / TCP-Verbindungsoptionen (falls über TCP verbunden)
ip_address = 192.168.1.100
tcp_port = 8888
# TCP Watchdog Interval (Befehl 0xCF): 1 s bis 600 s (Standard: 60 s)
tcp_watchdog_interval_s = 60


[Options]
# Data Frame Options (Befehle 0x97 / 0x98)
# Zeitstempel im Datenframe aktivieren:
# 0 = Deaktiviert, 1 = ms-Zeitstempel (4 Byte uint32), 2 = µs-Zeitstempel (5 Byte uint56)
timestamp_mode = 1

# Strommessbereich im Rückgabeframe mitsenden (Option 0x04):
# 0 = Deaktiviert (0x00), 1 = Aktiviert (0x01)
enable_current_range_output = 1


[Frontend]
# Frontend Configurations (Befehl 0xB0 / 0xB1)

# Messmodus (measurement_mode):
# 1 = 2-Punkt-Messung (0x01)
# 2 = 4-Punkt-Messung (0x02)
# 3 = 3-Punkt-Messung (0x03)
measurement_mode = 2

# Messkanal (measurement_channel):
# 1 = BNC Port / Port 1 (0x01)
# 2 = Extension Port (0x02)
# 3 = Extension Port 2 / Port 2 (0x03)
measurement_channel = 1

# Strommessbereich (current_range_settings):
# 0 = Autoranging (0x00)
# 1 = ±10 mA (0x01)
# 2 = ±100 µA (0x02)
# 4 = ±1 µA (0x04)
# 6 = ±10 nA (0x06)
current_range = 0

# Spannungsmessbereich (voltage_range_settings) [Optional]:
# 0 = Autoranging (0x00)
# 1 = ±1 V (0x01, Standard)
# 2 = ±0.09 V (0x02)
voltage_range = 1


[ExtensionPort]
# Extension Port Kanal-Auswahl (Befehl 0xB2 / 0xB3)
# Werte hängen vom angeschlossenen Modul ab (z. B. MuxModule)
counter_port = 0
reference_port = 0
working_sense_port = 0
working_port = 0


[FrequencySetup]
# Frequenzeinstellungen (Befehl 0xB6 Set Setup)
# Modus: "single" für Einzelfrequenz (0x02) oder "sweep" für Frequenzliste (0x03)
mode = single

# Einzelfrequenz-Parameter (falls mode = single):
frequency_hz = 1000.0, 5000.0
precision = 1.0

# Frequenz-Sweep-Parameter (falls mode = sweep):
start_frequency_hz = 100.0
stop_frequency_hz = 100000.0
count = 10
# Skalierung: "linear" or "logarithmic"
scale = logarithmic

# Anregungstyp (EOP 0x03):
# 1 = Spannungssignal (Voltage Excitation, Standard, Bereich: 0.0001 V bis 1.0 V)
# 2 = Stromsignal (Current Excitation, Bereich: 0.000001 A bis 0.010 A)
excitation_type = 1

# Anregungsamplitude (in V bei excitation_type=1 bzw. in A bei excitation_type=2)
amplitude = 0.1

# Erweiterte Frequenz-Optionen (EOP):
# Punkt-Verzögerung zwischen Messpunkten in Mikrosekunden (EOP 0x01, uint32)
point_delay_us = 0
# Phasensynchrones Umschalten (EOP 0x02): 0 = Inaktiv, 1 = Aktiv
phase_sync = 0


[DCBias]
# DC-Bias Einstellungen (Befehl 0xB6, Unterbefehle 0x30 / 0x33)
# DC Bias Aktivierung: 0 = Deaktivieren (0x00), 1 = Aktivieren (0x01)
dc_bias_enabled = 0

# DC Bias Spannung in Volt (float, Bereich: -1.0 V bis +1.0 V)
bias_voltage_v = 0.0


[SyncTime]
# Synchronisationszeit (Befehl 0xB9 / 0xBA)
# Zeit zwischen zwei Spektrenmessungen in Mikrosekunden (uint32)
# Min: 0 µs, Max: 180.000.000 µs (180s)
sync_time_us = 0


[Measurement]
# Messungs-Steuerung (Befehl 0xB8 Start Measure)
# Anzahl der zu messenden Spektren:
# 0 = Kontinuierliche Messung (muss manuell mit B8 01 00 B8 gestoppt werden)
# >0 = Exakte Anzahl an Durchläufen (z. B. 1 für Einzelmessung)
number_of_spectra = 1


#Geräteunspezifische Messeinstellungen

[ContinuousMeasurement]
# Steuerung Messwiederholungen / Wiederholungen der Messreihen
# Zeit bis zum beenden der Wiederholungen der Messreihen in s
# wenn "time_of_continuous_measurement" = 0 wird die Messreihe einmalig ausgeführt
time_of_continuous_measurement = 30
